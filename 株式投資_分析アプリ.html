<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("theme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<script>
  (() => {
    try {
      if (new URLSearchParams(window.location.search).get("theme")) return;
      const saved = localStorage.getItem("learn-ui:theme");
      if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) { /* storage unavailable */ }
  })();
</script>

:root {
  --x-ink: #1c1917;
  --x-ink-2: #2a2623;
  --x-card: #f4f4f2;
  --x-orange: #fb8619;
  --x-orange-2: #fb4a19;
  --x-grad: linear-gradient(90deg, #fb8619 0%, #fb4a19 100%);
  --x-cta: linear-gradient(90deg, #f26b0f 0%, #e0400e 100%);
  --x-lime: #c6f23a;
  --x-violet: #7b3fe4;
  --x-edge: #1c1917;
  --x-edge-soft: rgba(28, 25, 23, 0.14);
  --x-page: #f7f7f5;
  --x-side: #eeeeeb;
  --x-grid: rgba(28, 25, 23, 0.06);
  --x-grid-side: rgba(28, 25, 23, 0.075);
  --x-hdr: #1c1917;
  --x-box-bg: #1c1917;
  --x-box-fg: #ffffff;
  --x-font: "XDash", "Segoe UI", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", Meiryo, sans-serif;
  --x-en: "XDisplay", "XDash", "Segoe UI", "Noto Sans JP", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", Meiryo, sans-serif;
  --x-mono: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;

  --cp-bg: #f7f7f5;
  --cp-bg-elevated: #f4f4f2;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f4f4f2;
  --cp-border: #dbd8d4;
  --cp-border-strong: #8c857e;
  --cp-text: #1c1917;
  --cp-text-muted: #5c5752;
  --cp-text-soft: #6b6661;
  --cp-accent: #c2410c;
  --cp-accent-hover: #9a3412;
  --cp-accent-soft: rgba(251, 134, 25, 0.12);
  --cp-accent-fg: #ffffff;
  --cp-success: #15803d;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #2563eb;
  --cp-shadow: 0 14px 34px rgba(28, 25, 23, 0.16);
  --cp-overlay: rgba(255, 255, 255, 0.86);
  --cp-panel: rgba(255, 255, 255, 0.88);
  --cp-panel-strong: rgba(255, 255, 255, 0.97);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(251, 134, 25, 0.16);
}
html[data-theme="dark"] {
  --x-edge: #5f5851;
  --x-edge-soft: rgba(255, 255, 255, 0.14);
  --x-page: #1c1917;
  --x-side: #161311;
  --x-grid: rgba(255, 255, 255, 0.045);
  --x-grid-side: rgba(255, 255, 255, 0.05);
  --x-hdr: #0f0d0c;
  --x-box-bg: #f4f4f2;
  --x-box-fg: #1c1917;

  --cp-bg: #1c1917;
  --cp-bg-elevated: #211d1a;
  --cp-surface: #2a2623;
  --cp-surface-soft: #34302c;
  --cp-border: #4a443e;
  --cp-border-strong: #7d766f;
  --cp-text: #f4f4f2;
  --cp-text-muted: #c9c3bc;
  --cp-text-soft: #b1aaa2;
  --cp-accent: #fb8619;
  --cp-accent-hover: #ffa54f;
  --cp-accent-soft: rgba(251, 134, 25, 0.15);
  --cp-accent-fg: #1c1917;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #6ea8ff;
  --cp-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
  --cp-overlay: rgba(28, 25, 23, 0.9);
  --cp-panel: rgba(42, 38, 35, 0.82);
  --cp-panel-strong: rgba(42, 38, 35, 0.97);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(251, 134, 25, 0.2);
}

/* ---------- 土台：方眼紙 ---------- */
body {
  font-family: var(--x-font);
  background-color: var(--x-page);
  background-image:
    linear-gradient(to right, var(--x-grid) 1px, transparent 1px),
    linear-gradient(var(--x-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  font-synthesis: weight;
}
::selection { background: var(--x-lime); color: var(--x-ink); }
:focus-visible { outline: 3px solid var(--x-orange-2); outline-offset: 2px; }


/* ============ デザインレイヤー：学習アプリの部品（5つの学習アプリ共通） ============ */
/* ---------- ヘッダー：黒いバー＋読み進めたぶんだけ伸びるオレンジの線 ---------- */
header.top {
  background: var(--x-hdr);
  color: #fff;
  border-bottom: 0;
  min-height: 64px;
  padding: 10px 22px;
  gap: 18px;
}
header.top::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -4px; height: 4px; pointer-events: none;
  background: var(--x-grad) 0 0 / calc(var(--x-read, 0) * 100%) 100% no-repeat, #3a3531;
}
html[data-theme="dark"] header.top::after { background: var(--x-grad) 0 0 / calc(var(--x-read, 0) * 100%) 100% no-repeat, #2f2a26; }
.logo {
  width: 42px; height: 42px; border-radius: 13px;
  background: var(--x-grad); color: var(--x-ink);
  font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 1.2rem;
  box-shadow: inset 0 0 0 2px rgba(28, 25, 23, 0.18);
}
.brand { color: #fff; font-weight: 800; letter-spacing: 0.03em; display: flex; flex-direction: column; justify-content: center; }
.brand .x-en {
  display: block; font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 0.75rem;
  letter-spacing: 0.06em; line-height: 1.1; color: #fff; text-transform: uppercase; margin-bottom: 2px;
}
.brand .x-en em { font-style: italic; color: var(--x-orange); }
.brand small { display: none; }
header.top .prog { gap: 12px; }
header.top .bar { height: 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.28); }
header.top .bar > i { background: var(--x-grad); border-radius: 99px; }
header.top .prog span { color: rgba(255, 255, 255, 0.82); font-weight: 700; font-variant-numeric: tabular-nums; }
header.top .iconbtn, header.top .fsz button {
  background: transparent; color: #fff; border: 1.5px solid rgba(255, 255, 255, 0.34); border-radius: 999px;
  padding: 5px 13px; font-weight: 700;
}
header.top .iconbtn:hover, header.top .fsz button:hover { border-color: var(--x-orange); color: var(--x-orange); background: transparent; }
header.top .fsz button.on, header.top .fsz button.on:hover { background: #fff; border-color: #fff; color: var(--x-ink); }
header.top .fsz .lab { color: rgba(255, 255, 255, 0.72); }
header.top :focus-visible { outline-color: var(--x-orange); }

/* ---------- 目次：INDEX ---------- */
nav.side {
  background-color: var(--x-side);
  background-image:
    linear-gradient(to right, var(--x-grid-side) 1px, transparent 1px),
    linear-gradient(var(--x-grid-side) 1px, transparent 1px);
  background-size: 24px 24px;
  border-right: 2px solid var(--x-edge);
  padding: 18px 12px 48px;
  counter-reset: xidx;
}
nav.side::before {
  content: "INDEX"; display: block; margin: 4px 10px 8px;
  font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 2rem; line-height: 1; letter-spacing: -0.01em;
  color: var(--cp-text);
}
nav.side .grp {
  display: flex; align-items: center; gap: 8px;
  margin: 20px 10px 6px; color: var(--cp-accent);
  font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em;
}
nav.side .grp::before { content: ""; flex: 0 0 auto; width: 16px; height: 2px; background: currentColor; }
html[data-theme="dark"] nav.side .grp { color: var(--cp-accent); }
@media (min-width: 981px) {
  .layout { grid-template-columns: 304px minmax(0, 1fr); }
  body .share-note { left: calc(50% + 152px); }
}
@media (min-width: 981px) and (max-width: 1279px) {
  .layout { grid-template-columns: 272px minmax(0, 1fr); }
  body .share-note { left: calc(50% + 136px); }
}
nav.side button {
  counter-increment: xidx;
  display: grid; grid-template-columns: 1.6em auto minmax(0, 1fr) auto; align-items: center; gap: 7px;
  margin: 2px 0; padding: 8px 10px; border: 2px solid transparent; border-radius: 12px;
  color: var(--cp-text-muted); font-weight: 600; transition: background .15s, border-color .15s, color .15s;
}
nav.side button::before {
  content: counter(xidx, decimal-leading-zero);
  font-family: var(--x-mono); font-size: 0.6875rem; font-weight: 700; color: var(--cp-text-soft); letter-spacing: 0;
}
nav.side button:hover { background: var(--cp-surface); color: var(--cp-text); }
nav.side button.active {
  background: var(--cp-surface); border-color: var(--x-edge); color: var(--cp-text); font-weight: 800;
  box-shadow: 3px 3px 0 var(--x-edge);
}
nav.side button.active::before { color: var(--x-orange-2); }
nav.side .tag {
  min-width: 44px; border-radius: 999px; border: 1.5px solid var(--cp-border); background: var(--cp-surface);
  color: var(--cp-text-muted); font-size: 0.6875rem; font-weight: 800; padding: 1px 6px; letter-spacing: 0.02em;
}
nav.side button.active .tag { background: var(--x-ink); border-color: var(--x-ink); color: #fff; }
html[data-theme="dark"] nav.side button.active .tag { background: var(--x-orange); border-color: var(--x-orange); color: var(--x-ink); }
nav.side .ck {
  display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  background: var(--cp-success); color: #fff; font-size: 0.6875rem; font-weight: 900; line-height: 1;
}
html[data-theme="dark"] nav.side .ck { color: var(--x-ink); }

/* ---------- 本文 ---------- */
main { padding: 32px 42px 110px; }
@media (min-width: 981px) and (max-width: 1279px) { main { padding-left: 28px; padding-right: 28px; } }
.kicker {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--cp-accent); font-family: var(--x-en); font-style: italic; font-weight: 900;
  font-size: 0.8125rem; letter-spacing: 0.14em; text-transform: uppercase;
}
.kicker::before, .kicker::after { content: ""; width: 24px; height: 2px; background: currentColor; }
main h1 { font-weight: 900; letter-spacing: 0.01em; font-size: clamp(1.6rem, 1.15rem + 1.1vw, 2.125rem); margin: 8px 0 12px; }
main > h2, main > .lroot > h2, .card > h2 { position: relative; padding-left: 16px; font-weight: 900; }
main > h2::before, main > .lroot > h2::before, .card > h2::before {
  content: ""; position: absolute; left: 0; top: 0.22em; bottom: 0.22em; width: 6px; border-radius: 3px; background: var(--x-grad);
}
main > h2, main > .lroot > h2 { margin-top: 30px; }
h3 { font-weight: 800; }
.lead { color: var(--cp-text-muted); }
main a { color: var(--cp-link); font-weight: 600; }

/* カード：2pxの黒い枠＋大きめの角丸 */
.card {
  background: var(--cp-surface); border: 2px solid var(--x-edge); border-radius: 22px;
  padding: 22px 26px; margin: 20px 0; box-shadow: none;
}
.tile {
  background: var(--cp-surface); border: 2px solid var(--cp-border); border-radius: 18px; box-shadow: none;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.tile .t { font-weight: 800; }
.tile.click { border-color: var(--x-edge); }
.tile.click:hover { border-color: var(--x-edge); transform: translateY(-3px); box-shadow: 0 5px 0 var(--x-edge); }
.tile.sel { border-color: var(--x-orange-2); background: var(--cp-accent-soft); box-shadow: 0 0 0 2px var(--x-orange-2) inset; }
.kpi, .ma-kpi, .sb-kpi, .m10-kpi {
  background: var(--cp-surface); border: 2px solid var(--x-edge); border-radius: 18px;
}
.kpi .v, .ma-kpi .v, .sb-kpi .v, .m10-kpi .v, .bigscore {
  font-family: var(--x-en), var(--x-font); font-weight: 800; letter-spacing: -0.005em;
}
.bigscore {
  font-style: italic; font-weight: 900; font-size: 3.4rem; line-height: 1.15;
  background: var(--x-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
/* KPIの箱：入る数だけ横に並べ、細い箱では数字を途中で折り返さずに文字を小さくする */
.kpis, .ma-kpis, .ma-kpis.k4, .sb-kpis, .m10-kpis { grid-template-columns: repeat(auto-fit, minmax(min(132px, 100%), 1fr)); }
.kpis > .kpi, .ma-kpis > .ma-kpi, .sb-kpis > .sb-kpi, .m10-kpis > .m10-kpi { container-type: inline-size; }
@container (max-width: 220px) {
  .kpi .v, .ma-kpi .v, .sb-kpi .v, .m10-kpi .v { font-size: clamp(0.95rem, 13cqi, 1.5rem); overflow-wrap: anywhere; letter-spacing: -0.01em; }
}

/* ゴール：枠に乗ったラベル */
.goal {
  position: relative; background: var(--cp-surface); border: 2px solid var(--x-edge); border-radius: 16px;
  padding: 22px 22px 14px; margin: 26px 0 18px;
}
.goal::before {
  content: "GOAL"; position: absolute; top: -0.85em; left: 18px; padding: 1px 12px; border-radius: 999px;
  background: var(--x-ink); color: #fff; font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 0.75rem; letter-spacing: 0.14em; line-height: 1.5;
}
html[data-theme="dark"] .goal::before { background: var(--x-orange); color: var(--x-ink); }
.goal b { color: var(--cp-text); background: linear-gradient(transparent 60%, rgba(198, 242, 58, 0.85) 60%); }
html[data-theme="dark"] .goal b { background: none; color: var(--x-lime); }

/* ポイント：ライムのラベル */
.analogy {
  background: var(--cp-surface-soft); border-left: 5px solid var(--x-orange); border-radius: 6px 16px 16px 6px; padding: 14px 18px;
}
.analogy .lab {
  display: block; width: fit-content; max-width: 100%; background: var(--x-lime); color: var(--x-ink);
  padding: 0 10px; border-radius: 6px; margin-bottom: 6px; font-weight: 900;
}

/* メンター・CFOのひとこと：ターミナル風のウィンドウ */
.cfo {
  position: relative; overflow: hidden; background: var(--cp-surface); border: 2px solid var(--x-edge);
  border-radius: 18px; padding: 48px 22px 18px; margin: 22px 0;
}
.cfo::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 32px;
  background:
    radial-gradient(circle at 18px 16px, #ff5f57 0 5px, transparent 5.5px),
    radial-gradient(circle at 36px 16px, #febc2e 0 5px, transparent 5.5px),
    radial-gradient(circle at 54px 16px, #28c840 0 5px, transparent 5.5px),
    var(--x-ink);
}
.cfo::after {
  content: "voice.md"; position: absolute; top: 7px; left: 72px;
  font-family: var(--x-mono); font-size: 12px; line-height: 18px; color: rgba(255, 255, 255, 0.72);
}
html[data-theme="dark"] .cfo::before { background:
    radial-gradient(circle at 18px 16px, #ff5f57 0 5px, transparent 5.5px),
    radial-gradient(circle at 36px 16px, #febc2e 0 5px, transparent 5.5px),
    radial-gradient(circle at 54px 16px, #28c840 0 5px, transparent 5.5px),
    #0f0d0c; }
.cfo .lab { color: var(--cp-text); font-weight: 900; font-size: 0.9375rem; }
.cfo .lab::before {
  background: var(--x-grad); color: var(--x-ink); border-radius: 999px; padding: 0 10px;
  font-family: var(--x-en); font-style: italic; font-weight: 900; letter-spacing: 0.04em;
}

/* 確認問題 */
.quiz { background: var(--cp-surface); border: 2px solid var(--x-edge); border-radius: 20px; padding: 20px 22px; }
.quiz .q::before { background: var(--x-ink); color: #fff; border-radius: 999px; padding: 1px 11px; font-weight: 800; }
html[data-theme="dark"] .quiz .q::before { background: var(--x-orange); color: var(--x-ink); }
.opt {
  border: 2px solid var(--cp-border); border-radius: 14px; background: var(--cp-surface); font-weight: 600;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.opt:hover { border-color: var(--x-edge); transform: translateY(-1px); box-shadow: 0 3px 0 var(--x-edge); }
.opt.right { border-color: var(--cp-success); background: color-mix(in srgb, var(--cp-success) 10%, var(--cp-surface)); box-shadow: none; transform: none; }
.opt.wrong { border-color: var(--cp-danger); background: color-mix(in srgb, var(--cp-danger) 8%, var(--cp-surface)); box-shadow: none; transform: none; }
.fb.show { border-top: 2px dashed var(--cp-border); padding-top: 10px; margin-top: 12px; }

/* ボタン：ふだんは黒いピル、いちばん大事な1つだけオレンジ */
.btn {
  border: 2px solid var(--x-ink); background: var(--x-ink); color: #fff; border-radius: 999px;
  padding: 8px 20px; font-weight: 800; letter-spacing: 0.02em;
  transition: transform .12s, box-shadow .15s, background .15s, border-color .15s;
}
.btn:hover { background: var(--x-ink-2); border-color: var(--x-ink-2); box-shadow: 0 0 0 3px rgba(251, 134, 25, 0.45); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--cp-surface); color: var(--cp-text); border-color: var(--x-edge); }
.btn.ghost:hover { background: var(--cp-surface-soft); box-shadow: 0 3px 0 var(--x-edge); }
.btn:disabled, .btn:disabled:hover { box-shadow: none; transform: none; }
html[data-theme="dark"] .btn { background: var(--x-orange); border-color: var(--x-orange); color: var(--x-ink); }
html[data-theme="dark"] .btn:hover { background: #ffa54f; border-color: #ffa54f; box-shadow: 0 0 0 3px rgba(251, 134, 25, 0.3); }
html[data-theme="dark"] .btn.ghost { background: var(--cp-surface); color: var(--cp-text); border-color: var(--x-edge); }
html[data-theme="dark"] .btn.ghost:hover { background: var(--cp-surface-soft); box-shadow: none; }

.btn.x-cta, .next-row .btn[data-complete] {
  background: var(--x-cta); color: #fff; border: 2.5px solid #fff;
  box-shadow: 0 0 0 2px #e0400e, 0 10px 22px rgba(224, 64, 14, 0.32);
  font-size: 1.1875rem; font-weight: 900; padding: 11px 14px 11px 26px; gap: 12px;
}
.btn.x-cta:hover, .next-row .btn[data-complete]:hover {
  background: linear-gradient(90deg, #e35f0a 0%, #c9370b 100%); border-color: #fff;
  box-shadow: 0 0 0 2px #c9370b, 0 12px 26px rgba(224, 64, 14, 0.4); transform: translateY(-1px);
}
html[data-theme="dark"] .btn.x-cta, html[data-theme="dark"] .next-row .btn[data-complete] { color: #fff; border-color: var(--x-page); }
.x-arrow {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: #fff; position: relative;
}
.x-arrow::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px;
  border-top: 3px solid #e0400e; border-right: 3px solid #e0400e; transform: translate(-65%, -50%) rotate(45deg);
}
.next-row { border-top: 2px dashed var(--x-edge-soft); padding-top: 22px; margin-top: 40px; gap: 12px; }

.x-cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; margin: 18px 0 8px; }
.x-cta-note { font-size: 0.875rem; color: var(--cp-text-muted); font-weight: 700; }
.x-cta-note b { font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 1.25rem; color: var(--cp-accent); margin: 0 2px; }

/* ピル・チップ・切り替え */
.pill { border-radius: 999px; border: 1.5px solid var(--cp-border); font-weight: 800; letter-spacing: 0.02em; padding: 1px 10px; }
.pill.acc { background: var(--cp-surface); border: 2px solid var(--x-edge); color: var(--cp-text); }
.pill.ok { background: var(--cp-success); border-color: var(--cp-success); color: #fff; }
html[data-theme="dark"] .pill.ok { color: var(--x-ink); }
.pill.warn { color: #b45309; border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
html[data-theme="dark"] .pill.warn { color: var(--cp-warning); }
.chip { border: 2px solid var(--x-edge); border-radius: 999px; background: var(--cp-surface); font-weight: 700; padding: 6px 16px; transition: background .15s; }
.chip:hover { background: var(--cp-surface-soft); }
.chip.sel { background: var(--x-ink); border-color: var(--x-ink); color: #fff; }
html[data-theme="dark"] .chip.sel { background: var(--x-orange); border-color: var(--x-orange); color: var(--x-ink); }
.seg { border: 2px solid var(--x-edge); border-radius: 999px; background: var(--cp-surface); padding: 3px; gap: 3px; }
.seg button { border-radius: 999px; padding: 6px 15px; font-weight: 700; background: transparent; }
.seg button + button { border-left: 0; }
.seg button.on { background: var(--x-ink); color: #fff; }
html[data-theme="dark"] .seg button.on { background: var(--x-orange); color: var(--x-ink); }
.sw { border: 2px solid var(--cp-border); border-radius: 14px; transition: border-color .15s, background .15s; }
.sw:hover { border-color: var(--x-edge); }
.sw.on { border-color: var(--x-edge); background: var(--cp-accent-soft); }
input[type=range] { accent-color: var(--x-orange-2); }
.search, .ma-cq input {
  border: 2px solid var(--x-edge); border-radius: 999px; padding: 10px 18px; background: var(--cp-surface);
}
.ma-cq input { border-radius: 10px; padding: 6px 10px; }
.search:focus, .ma-cq input:focus { outline: none; box-shadow: 0 0 0 4px rgba(251, 134, 25, 0.35); }

/* 表：見出しの行は黒 */
table.fs { border-top: 0; }
table.fs tr:first-child > th { background: var(--x-ink); color: #fff; border-bottom: 0; letter-spacing: 0.05em; }
table.fs tr:first-child > th:first-child { border-top-left-radius: 10px; }
table.fs tr:first-child > th:last-child { border-top-right-radius: 10px; }
html[data-theme="dark"] table.fs tr:first-child > th { background: #3a3531; color: #fff; }
table.fs tr:not(:first-child) > th { background: var(--cp-surface-soft); color: var(--cp-text); }
:where(table.fs) :where(tr:nth-child(even)) > td { background: rgba(28, 25, 23, 0.025); }
html[data-theme="dark"] :where(table.fs) :where(tr:nth-child(even)) > td { background: rgba(255, 255, 255, 0.025); }
table.fs tr.tot td { font-weight: 800; background: var(--cp-surface-soft); border-top: 2px solid var(--x-edge); }
table.fs tr.sec td { color: var(--cp-accent); border-bottom: 2px solid var(--x-orange); }
.journal th { border-bottom: 2px solid var(--x-edge); color: var(--cp-text); font-weight: 800; }
.journal td.acct { background: var(--cp-accent-soft); }
.tbl-wrap { border-radius: 10px; }

/* グラフ・図 */
.bar { height: 10px; border: 1.5px solid var(--x-edge-soft); }
.bar > i { background: var(--x-grad); border-radius: 99px; }
.hbar { border: 2px solid var(--x-edge); border-radius: 12px; height: 36px; }
.flow .st { border: 2px solid var(--x-edge); border-radius: 14px; background: var(--cp-surface); }
.flow .st b { color: var(--cp-accent); }
.flow .arr { color: var(--x-orange-2); font-size: 1.1rem; }
.tl { border-left: 2px dashed var(--x-edge); }
.tl .it::before { background: var(--x-grad); box-shadow: 0 0 0 2px var(--cp-bg), 0 0 0 4px var(--x-edge); }
.tl .d { font-weight: 800; }
.code { border: 2px solid var(--x-edge); border-radius: 12px; background: var(--cp-surface); font-weight: 900; }
.ma-card, .sb-card, .m10-card { border: 2px solid var(--x-edge); border-radius: 18px; }
.ma-card.best { border-color: var(--x-orange-2); box-shadow: 0 0 0 2px var(--x-orange-2) inset; }
.ma-iv, .qrev { border: 2px solid var(--cp-border); border-left-width: 6px; border-radius: 14px; }
.ma-iv.ok { border-left-color: var(--cp-success); }
.ma-iv.again { border-left-color: var(--cp-warning); }
.qrev { border-left-color: var(--cp-danger); }
pre.mail { border: 2px solid var(--x-edge); border-radius: 14px; background: var(--cp-surface-soft); }

/* Excelの対応シート */
.xlref { border: 1.5px solid var(--x-edge); background: var(--cp-surface); color: var(--cp-text-muted); font-weight: 600; padding: 4px 14px; }
.xlref b { color: var(--cp-text); }

/* ページの先頭へ */
.totop { background: var(--x-ink); color: #fff; border: 2px solid var(--x-ink); width: 48px; height: 48px; font-size: 0.9rem; }
.totop:hover { border-color: var(--x-orange); color: var(--x-orange); box-shadow: 0 0 0 3px rgba(251, 134, 25, 0.35); }
html[data-theme="dark"] .totop { background: var(--x-orange); color: var(--x-ink); border-color: var(--x-orange); }

/* ---------- トップページ：黒ボックスの見出し ---------- */
main.x-home > h1, main.x-home > .lroot > h1 { font-size: clamp(1.75rem, 1.1rem + 1.9vw, 2.75rem); line-height: 1.95; margin: 14px 0 14px; }
main.x-home h1 .x-box {
  background: var(--x-box-bg); color: var(--x-box-fg); padding: 0.06em 0.42em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
main.x-home h1 .x-hl { font-style: normal; color: var(--x-orange); }
html[data-theme="dark"] main.x-home h1 .x-hl { color: #e0400e; }
main.x-home .grid3 { counter-reset: xt 1; }
main.x-home .grid3 > .tile.click { counter-increment: xt; position: relative; padding-right: 64px; }
main.x-home .grid3 > .tile.click::after {
  content: counter(xt, decimal-leading-zero); position: absolute; right: 14px; top: 8px;
  font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 1.75rem; line-height: 1.1;
  background: var(--x-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- プレビューのお知らせ（共有用の補助） ---------- */
body .share-note {
  border: 2px solid var(--x-edge); border-radius: 14px; background: var(--cp-surface); color: var(--cp-text);
  box-shadow: 4px 4px 0 var(--x-edge);
}

/* ---------- スマホ・タブレット ---------- */
@media (max-width: 980px) {
  header.top { padding: 8px 12px; gap: 8px 10px; }
  .logo { width: 36px; height: 36px; border-radius: 11px; font-size: 1.05rem; }
  .brand .x-en { font-size: 0.6875rem; }
  header.top .navbtn { color: #fff; border-color: rgba(255, 255, 255, 0.34); }
  nav.side { border-right: 0; border-bottom: 2px solid var(--x-edge); }
  main { padding: 20px 16px 96px; }
  .card { padding: 18px 16px; border-radius: 18px; }
  .next-row .btn[data-complete] { width: 100%; justify-content: space-between; font-size: 1.0625rem; }
  main.x-home > h1, main.x-home > .lroot > h1 { line-height: 1.9; }
  /* 表：列が多い表は横にスクロール。1列目（科目名）は左に固定して読みやすく */
  main div > table.fs:has(tr > :nth-child(4)) { min-width: 520px; }
  main div > table.fs:has(tr > :nth-child(6)) { min-width: 640px; }
  main div > table.fs:has(tr > :nth-child(4)) tr > :first-child:not([colspan]) {
    min-width: 6.5em; max-width: 9em; position: sticky; left: 0; z-index: 1; box-shadow: inset -1px 0 0 var(--cp-border);
  }
  main div > table.fs:has(tr > :nth-child(4)) tr > td:first-child:not([colspan]) { background: var(--cp-surface); }
  main div > table.fs:has(tr > :nth-child(4)) tr.tot > td:first-child:not([colspan]) { background: var(--cp-surface-soft); }
}
@media (max-width: 640px) {
  .brand .x-en { display: none; }
  .x-cta-row .btn.x-cta { width: 100%; justify-content: space-between; font-size: 1.0625rem; }
}

/* ---------- 動きを減らす設定 ---------- */
@media (prefers-reduced-motion: reduce) {
  .tile, .opt, .btn, .chip, .sw, nav.side button { transition: none !important; }
  .tile.click:hover, .opt:hover, .btn:hover, .btn.x-cta:hover, .next-row .btn[data-complete]:hover { transform: none !important; }
}

/* ---------- 印刷 ---------- */
@media print {
  body { background: #fff !important; }
  .card, .quiz, .goal, .cfo, .tile, .kpi { border-width: 1px !important; box-shadow: none !important; }
  .cfo { padding-top: 16px; }
  .cfo::before, .cfo::after { display: none; }
  main.x-home h1 .x-box { background: none; color: inherit; padding: 0; }
  .x-cta-row { display: none; }
}

<body>
<header class="top">
  <div class="logo" aria-hidden="true">株</div>
  <div class="brand"><span class="x-en" aria-hidden="true">STOCK <em>ANALYST</em></span>日本株・米国株 分析ラーニングアプリ<small>ファンダメンタル分析＆テクニカル分析を初級・中級・上級・超上級で</small></div>
  <button class="iconbtn navbtn" id="navBtn" type="button" aria-controls="nav" aria-expanded="false">☰ 目次</button>
  <span class="hbreak" aria-hidden="true"></span>
  <div class="prog" title="完了したレッスンの数">
    <div class="bar"><i id="progbar"></i></div>
    <span id="progtxt">0 / 0 完了</span>
  </div>
  <div class="fsz" role="group" aria-label="文字の大きさ"><span class="lab">文字サイズ</span><button type="button" data-fs="m" title="標準の文字サイズ">標準</button><button type="button" data-fs="l" title="少し大きく">大</button><button type="button" data-fs="xl" title="もっと大きく">特大</button></div>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="ライト／ダーク切り替え" title="ライト／ダーク切り替え">◐<span class="lab"> 表示切替</span></button>
</header>
<div class="layout">
  <nav class="side" id="nav" aria-label="レッスン一覧"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<script>
  (() => {
    const root = document.documentElement, hdr = document.querySelector("header.top");
    const syncHdr = () => { if (hdr) root.style.setProperty("--hdr-h", hdr.offsetHeight + "px"); };
    const mark = () => {
      const cur = root.getAttribute("data-fs") || "m";
      document.querySelectorAll(".fsz button").forEach((b) => { const on = b.dataset.fs === cur; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
      syncHdr();
    };
    document.querySelectorAll(".fsz button").forEach((b) => b.addEventListener("click", () => {
      const v = b.dataset.fs;
      if (v === "m") root.removeAttribute("data-fs"); else root.setAttribute("data-fs", v);
      try { localStorage.setItem("learn-ui:fs", v); } catch (e) { /* storage unavailable */ }
      mark();

<script>
  (() => {
    const root = document.documentElement;
    // remember the light/dark choice (the button itself is wired in each app)
    try {
      new MutationObserver(() => {
        try { localStorage.setItem("learn-ui:theme", root.getAttribute("data-theme") || "light"); } catch (e) { /* storage unavailable */ }
      }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    } catch (e) { /* MutationObserver unavailable */ }
    // favicon drawn from the header logo in the theme accent color
    const logo = document.querySelector(".logo");
    if (logo) {
      const cs = getComputedStyle(root);
      const acc = cs.getPropertyValue("--cp-accent").trim(), fg = cs.getPropertyValue("--cp-accent-fg").trim();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${acc}"/><text x="32" y="44" font-size="34" font-weight="700" text-anchor="middle" fill="${fg}" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">${logo.textContent.trim()}</text></svg>`;
      let icon = document.querySelector('link[rel="icon"]');
      if (!icon) { icon = document.createElement("link"); icon.rel = "icon"; document.head.appendChild(icon); }
      icon.href = "data:image/svg+xml," + encodeURIComponent(svg);
    }
    // phones / tablets: the lesson list opens as a drawer from the header
    const navBtn = document.getElementById("navBtn");
    const setNav = (open) => {
      document.body.classList.toggle("nav-open", open);
      if (navBtn) navBtn.setAttribute("aria-expanded", open ? "true" : "false");
    };
    if (navBtn) navBtn.addEventListener("click", (e) => { e.stopPropagation(); setNav(!document.body.classList.contains("nav-open")); });
    document.addEventListener("click", (e) => {
      if (!document.body.classList.contains("nav-open")) return;
      if (e.target.closest("#nav [data-go]") || !e.target.closest("#nav")) setNav(false);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setNav(false); });
    // back-to-top button for long lessons
    const up = document.createElement("button");
    up.type = "button"; up.className = "totop"; up.textContent = "▲"; up.title = "ページの先頭へ"; up.setAttribute("aria-label", "ページの先頭へ");
    up.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    document.body.appendChild(up);
    window.addEventListener("scroll", () => up.classList.toggle("show", window.scrollY > 900), { passive: true });
    // deep links: #lesson-id in the address bar (bookmarks, sharing, browser back/forward)
    const baseTitle = document.title;
    window.LearnShell = {
      hashId() { try { return decodeURIComponent(window.location.hash.slice(1)); } catch (e) { return ""; } },
      sync(id, title) {
        document.title = title && id !== "welcome" ? `${title}｜${baseTitle}` : baseTitle;
        try {
          const h = "#" + encodeURIComponent(id);
          if (!window.location.hash) history.replaceState(null, "", h);
          else if (window.location.hash !== h) history.pushState(null, "", h);
        } catch (e) { /* history API unavailable (sandboxed preview) */ }
      },
      start(lessons, fallback) { const h = this.hashId(); return lessons.some((l) => l.id === h) ? h : fallback; },
      xlRef(root, name) {
        const h1 = root.querySelector("h1");
        if (!h1 || !name) return;
        const p = document.createElement("p");
        p.className = "xlref";
        p.innerHTML = `<span aria-hidden="true">📗</span> Excel版の対応シート：「<b>${name}</b>」`;
        h1.insertAdjacentElement("afterend", p);
      },
    };
    const onHash = () => {
      const h = window.LearnShell.hashId();
      if (!h || typeof go !== "function" || typeof LESSONS === "undefined") return;
      if (LESSONS.some((l) => l.id === h) && h !== current) go(h);
    };
    window.addEventListener("popstate", onHash);
    window.addEventListener("hashchange", onHash);
    // shared quiz runner: one question at a time, score, review of missed questions, retry only the missed ones
    window.LearnQuiz = (box, all, cfg = {}) => {
      const AB = "ABCD";
      let qs = all, i = 0, score = 0, answered = false, wrong = [], retry = false;
      const title = (id) => (typeof LESSONS !== "undefined" && (LESSONS.find((l) => l.id === id) || {}).title) || "";
      const review = (q) => (q.lesson && title(q.lesson) ? `<a href="#" data-go="${q.lesson}">→「${title(q.lesson)}」を復習</a>` : "");
      const run = (list, isRetry) => { qs = list; i = 0; score = 0; wrong = []; retry = isRetry; show(); };
      const result = () => {
        const n = qs.length;
        let best = null;
        if (!retry && cfg.store && cfg.key) { best = Math.max(cfg.store.get(cfg.key, 0), score); cfg.store.set(cfg.key, best); }
        const msg = retry ? (score === n ? "全問クリア！ 苦手だった問題も、もう大丈夫です。" : "あと少し。解説とレッスンをもう一度読んでから、再チャレンジしよう。") : (cfg.msg ? cfg.msg(score, n) : "");
        const rev = wrong.map(({ q, j }) => `<div class="qrev"><div class="qq">${q.no ? `Q${q.no}　` : ""}${q.q}</div>
          <div class="qa ng">あなたの答え：${AB[j]}．${q.opts[j]}</div><div class="qa ok">正解：${AB[q.ans]}．${q.opts[q.ans]}</div>
          <div class="qe">${q.exp}${review(q) ? "　" + review(q) : ""}</div></div>`).join("");
        box.innerHTML = `<div style="text-align:center"><div class="kicker">${retry ? "RETRY RESULT" : "RESULT"}</div><div class="bigscore">${score} / ${n}</div>
          <p><b>${msg}</b></p>${best !== null ? `<p class="small muted">これまでの最高点：${best} 点</p>` : ""}
          <div class="btnrow" style="justify-content:center">${wrong.length ? `<button class="btn" type="button" data-qz="wrong">間違えた${wrong.length}問だけ解き直す</button>` : ""}
          <button class="btn${wrong.length ? " ghost" : ""}" type="button" data-qz="all">もう一度チャレンジ（${all.length}問）</button></div></div>
          ${wrong.length ? `<h3>間違えた問題の振り返り（${wrong.length}問）</h3><p class="small muted">正解と解説を読んで、必要ならレッスンに戻って復習しましょう。</p>${rev}` : `<p class="small muted" style="text-align:center">全問正解です。用語集やExcelの練習問題で、さらに力をのばしましょう。</p>`}`;
        const missed = wrong.map((w) => w.q);
        const bw = box.querySelector('[data-qz="wrong"]');
        if (bw) bw.addEventListener("click", () => run(missed, true));
        box.querySelector('[data-qz="all"]').addEventListener("click", () => run(all, false));
      };
      const show = () => {
        if (i >= qs.length) { result(); return; }
        const q = qs[i]; answered = false;
        box.innerHTML = `<div class="small muted">${retry ? "解き直し　｜　" : ""}問題 ${i + 1} / ${qs.length}　｜　正解 ${score}${cfg.pill ? "　｜　" + cfg.pill(q) : ""}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${(i / qs.length) * 100}%"></i></div>
          <h2>${q.q}</h2><div class="opts">${q.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${AB[j]}．${o}</button>`).join("")}</div>
          <div class="fb" id="qfb"></div><div class="btnrow"><button class="btn hide" type="button" id="qnext">${i + 1 === qs.length ? "結果を見る" : "次の問題へ ▶"}</button></div>`;
        box.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
          if (answered) return; answered = true;
          const j = +b.dataset.j;
          if (j === q.ans) score += 1; else wrong.push({ q, j });
          box.querySelectorAll(".opt").forEach((x) => { const jj = +x.dataset.j; if (jj === q.ans) x.classList.add("right"); else if (jj === j) x.classList.add("wrong"); });
          const fb = box.querySelector("#qfb");
          fb.innerHTML = `<b>${j === q.ans ? "正解！" : "おしい！ 正解は " + AB[q.ans]}</b>　${q.exp}${review(q) ? "　" + review(q) : ""}`;
          fb.classList.add("show");
          box.querySelector("#qnext").classList.remove("hide");
        }));
        box.querySelector("#qnext").addEventListener("click", () => { i += 1; show(); });
      };
      run(all, false);
    };
  })();
</script>

function hashStr(t) { let h = 2166136261; for (const ch of t) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function mq(q, options, answer, explain) {
  const opts = options.map((o, i) => [o, i]);
  if (!options.every((o) => /^[約−+\-]?[0-9０-９]/.test(o))) {
    let h = hashStr(q);
    for (let i = opts.length - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; const j = h % (i + 1); [opts[i], opts[j]] = [opts[j], opts[i]]; }
  }
  const ans = opts.findIndex((x) => x[1] === answer);
  return `<div class="quiz" data-ans="${ans}"><div class="q">${q}</div><div class="opts">${opts
    .map(([o], i) => `<button class="opt" type="button" data-i="${i}">${"ABCD"[i]}．${o}</button>`).join("")}</div><div class="fb">${explain}</div></div>`;
}

function M(co) {

  const fcf = co.cfo - co.capex, g1 = rev / co.rev[1] - 1, per = co.price / eps;
  const epsg = (co.ni / co.shares) / (co.ni0 / co.shares0) - 1;
  const ev = mcap + co.debt - co.cash, ebitda = co.op + co.da;
  const divTot = co.dps * co.shares / k, payTot = divTot + co.buyback;

function sma(x, n) { const o = new Array(x.length).fill(null); let s = 0; for (let i = 0; i < x.length; i++) { s += x[i]; if (i >= n) s -= x[i - n]; if (i >= n - 1) o[i] = s / n; } return o; }
function ema(x, n) { const o = new Array(x.length).fill(null); const a = 2 / (n + 1); let s = 0; for (let i = 0; i < n; i++) s += x[i]; o[n - 1] = s / n; for (let i = n; i < x.length; i++) o[i] = o[i - 1] + a * (x[i] - o[i - 1]); return o; }
function rsiCalc(c, n = 14) {
  const o = new Array(c.length).fill(null); let ag = 0, al = 0;
  for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; ag += Math.max(d, 0); al += Math.max(-d, 0); }
  ag /= n; al /= n; o[n] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  for (let i = n + 1; i < c.length; i++) { const d = c[i] - c[i - 1]; ag = (ag * (n - 1) + Math.max(d, 0)) / n; al = (al * (n - 1) + Math.max(-d, 0)) / n; o[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al); }

    ${mq("米国株を1ドル145円で買い、株価は変わらず、1ドル155円のときに売った。円で見ると？", ["損をする", "変わらない", "円安の分だけ利益が出る", "税金がかからない"], 2, "株価が同じでも、円安になれば円での価値は約6.9%増えます。逆に円高なら減ります。")}
    ${mq("日本株を買うときの一般的な単位は？", ["1株", "10株", "100株", "1,000株"], 2, "日本株は100株（単元株）。米国株は1株から買えます。")}

/* ---------- F basic ---------- */
function Ratios() {
  return { html: `${head("F 初級", "株価指標 ― PER・PBR・配当利回りで「値段」を測る", "株価だけでは高いか安いかは分かりません。利益・純資産・配当と比べて「何倍か」を見ます。")}
    ${goal("EPS・BPS・PER・PBR・配当利回り・配当性向を自分で計算し、6社を正しく比べられる。")}
    <div class="card"><h2>5つの基本の式</h2><table class="fs"><tr><th>指標</th><th>式</th><th>ひとことで</th></tr>
      <tr><td><b>EPS</b></td><td>純利益÷株式数<br><span class="small muted">（正式には期中平均・自己株式を除く）</span></td><td class="small">1株あたりの利益</td></tr><tr><td><b>PER</b></td><td>株価÷EPS</td><td class="small">利益の何年分の値段か（期待の温度計）</td></tr>

      <tr><td><b>配当利回り</b></td><td>1株配当÷株価</td><td class="small">配当性向＝1株配当÷EPS</td></tr></table>
      <p class="note">ケースの6社は自己株式がない設定なので、簡単のため「株式数」で割っています。米国では、潜在株（ストックオプションなど）を含めた「希薄化後EPS」がよく使われます。<br>PERには、直近の本決算の実績EPSで計算する「実績PER」と、今期の予想EPSで計算する「予想PER」があります。ふだんニュースや証券会社のサイトで見るのは予想PERが多い（このアプリは実績EPSで計算。ミライ精機は実績18.8倍、会社予想EPS 185円なら予想PER17.3倍）。比べるときはPERの種類をそろえましょう。</p></div>

    <div class="card"><h2>6社のPERとPBRを比べる（今の株価）</h2><div class="cbars" id="rbars"></div><p class="note">PERは業種や成長性で水準が大きくちがいます。比べるときは「同じ業種」「同じ市場」が基本です。</p></div>
    ${mq("ミライ精機（株価3,200円・純利益170億円・株式数1億株）のPERは？", ["約11.8倍", "約18.8倍", "約25.0倍", "約1.7倍"], 1, "EPS＝170億円÷1億株＝170円。3,200÷170＝約18.8倍。")}
    ${mq("ミライ精機の会社予想EPS（今期・2027年3月期）は185円。株価3,200円のときの予想PERは？", ["約16.4倍", "約17.3倍", "約18.8倍", "約20.0倍"], 1, "3,200÷185＝約17.3倍。実績PER（18.8倍）より低く見えます。他の会社と比べるときは、実績PER同士・予想PER同士でそろえます。")}
    ${mq("サクラ食品のPBRが0.88倍。正しい読み方は？", ["必ず割安なので買い", "解散価値より安く評価されている。ROEが低いなど理由を確認する", "赤字の会社である", "配当がない"], 1, "PBR1倍割れは「市場が資本をうまく使えていないと見ている」サインのことも。ROEとセットで確認します。")}
    ${pro("PERが低い株は「お買い得」に見えますが、利益が減りそうだから安い（バリュー・トラップ）こともあります。指標は答えではなく、質問を見つける道具です。")}`,
  mount(root) {
    let ci = 0;
    const upd = () => {
      const c = CO[ci], m = M(c), f = +$("#rp", root).value / 100, p = c.price * f;
      $("#rpo", root).textContent = ps(c, p, isJP(c) ? 0 : 2);

      $("#rk", root).innerHTML = kpi("EPS（1株利益）", ps(c, m.eps, isJP(c) ? 1 : 2)) + kpi("BPS（1株純資産）", ps(c, m.bps, isJP(c) ? 0 : 2)) + kpi("1株配当", c.dps ? ps(c, c.dps) : "なし") + kpi("時価総額", money(c, m.mcap * f));
      $("#rk2", root).innerHTML = kpi("PER", xx(per), per > 30 ? "高い期待" : per < 12 ? "低い期待" : "ふつう") + kpi("PBR", xx(pbr, 2), pbr < 1 ? "1倍割れ" : "", pbr < 1 ? "neg" : "") + kpi("配当利回り", pc(dy, 2)) + kpi("配当性向", pc(m.payout));
      $("#rmsg", root).textContent = f !== 1 ? `株価が${spc(f - 1, 0)}動くと、EPSやBPSは同じでも、PER・PBRは同じ割合で動き、配当利回りは逆に動きます。` : "スライダーで株価を動かしてみよう。";
    };
    $("#rco", root).addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; ci = +b.dataset.i; $$(".chip", $("#rco", root)).forEach((x) => x.classList.toggle("sel", x === b)); upd(); });

  } };
}

/* ---------- F intermediate ---------- */
function chips(id, on) { return `<div class="chips" id="${id}">${CO.map((c, i) => `<button type="button" class="chip ${i === on ? "sel" : ""}" data-i="${i}">${c.name}</button>`).join("")}</div>`; }
function bindChips(root, id, fn) {
  $("#" + id, root).addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; $$(".chip", $("#" + id, root)).forEach((x) => x.classList.toggle("sel", x === b)); fn(+b.dataset.i); });
}

function Dupont() {
  return { html: `${head("F 中級", "収益性・安全性・成長性 ― ROEを分解して「稼ぐ力の中身」を見る", "ROE＝売上高純利益率×総資産回転率×財務レバレッジ（デュポン分析）。同じROEでも中身はまったくちがいます。")}
    ${goal("ROEを3つに分解し、利益率・効率・借入のどれで稼いでいるかを説明できる。ROICや自己資本比率も合わせて判断できる。")}
    <div class="card"><h2>会社を選んで、ROEを分解しよう</h2>${chips("dco", 4)}
      <div class="kpis" id="dk" style="margin-top:12px"></div>
      <h3>もしも…（スライダーで3つの要素を動かす）</h3>
      ${slider("d1", "売上高純利益率（%）", 1, 30, 0.1, 10)}${slider("d2", "総資産回転率（回）", 0.2, 2.5, 0.01, 0.6)}${slider("d3", "財務レバレッジ（倍）", 1, 5, 0.05, 3.5)}
      <div class="kpis" id="dk2"></div><div class="btnrow"><button class="btn ghost" type="button" id="dreset">選んだ会社の値に戻す</button></div></div>
    <div class="card"><h2>6社の比較</h2><div class="tbl-wrap"><table class="fs" id="dtab"></table></div>
      <p class="note">ROIC（投下資本利益率）＝営業利益×（1−税率）÷（純資産＋有利子負債−現金）。分子は税引後営業利益、分母は事業に使っているお金（投下資本）で、「事業そのものの利回り」を表します。自己資本比率＝純資産÷総資産、D/E＝有利子負債÷純資産、売上CAGR＝2年間の売上の年平均成長率。</p></div>
    ${mq("RedwoodとAtlasはどちらもROE20%。ちがいとして正しいのは？", ["Redwoodは借入（レバレッジ3.5倍）の力が大きい", "Atlasは赤字", "Redwoodは現金が多い", "ちがいはない"], 0, "Redwoodは総資産÷純資産＝3.5倍。借入で資産をふくらませてROEを高めています。金利上昇や不況に弱い面もあります。")}
    ${mq("ヒカリ・ソフトのROEは約20.6%なのにROICは60%超。理由は？", ["現金が多く、事業に使っているお金が小さいから", "借入が多いから", "赤字だから", "配当が多いから"], 0, "ROIC＝税引後営業利益÷（純資産＋有利子負債−現金）。現金120億円を除くと、事業そのものの利回りはとても高い。")}
    ${pro("ROEが高い理由が「借入」なら、金利や景気に弱い可能性がある。理由が「利益率」なら競争力の証。数字の高さより、どこから来たかを見るのが中級者です。")}`,
  mount(root) {
    let ci = 4, ex = null;
    const draw = () => {
      const c = CO[ci], m = M(c);
      $("#dk", root).innerHTML = kpi("売上高純利益率", pc(m.npm)) + kpi("× 総資産回転率", fd(m.turn, 2) + "回") + kpi("× 財務レバレッジ", xx(m.lev, 2)) + kpi("＝ ROE", pc(m.roe), `ROA ${pc(m.roa)}／ROIC ${pc(m.roic)}`, "pos");
    };
    const whatif = () => {
      const a = ex && ex.d1 != null ? ex.d1 : +$("#d1", root).value / 100, b = ex && ex.d2 != null ? ex.d2 : +$("#d2", root).value, c = ex && ex.d3 != null ? ex.d3 : +$("#d3", root).value;
      $("#d1o", root).textContent = pc(a); $("#d2o", root).textContent = fd(b, 2) + "回"; $("#d3o", root).textContent = xx(c, 2);
      const roe = +(a * b * c).toFixed(12);
      $("#dk2", root).innerHTML = kpi("もしものROE", pc(roe), roe >= 0.08 ? "8%以上（目安クリア）" : "8%未満", roe >= 0.08 ? "pos" : "neg") + kpi("自己資本比率", pc(1 / c), "1÷レバレッジ") + kpi("D/Eのイメージ", c > 3 ? "借入が多い" : c > 2 ? "ふつう" : "借入が少ない", "") + kpi("ROA", pc(+(a * b).toFixed(12)), "利益率×回転率");
    };
    const reset = () => { const m = M(CO[ci]); ex = { d1: m.npm, d2: m.turn, d3: m.lev }; $("#d1", root).value = (m.npm * 100).toFixed(1); $("#d2", root).value = m.turn.toFixed(2); $("#d3", root).value = m.lev.toFixed(2); whatif(); };
    bindChips(root, "dco", (i) => { ci = i; draw(); reset(); });
    ["d1", "d2", "d3"].forEach((id) => $("#" + id, root).addEventListener("input", () => { if (ex) ex[id] = null; whatif(); }));
    $("#dreset", root).addEventListener("click", reset);
    draw(); reset();
    $("#dtab", root).innerHTML = `<tr><th>会社</th><th class="n">純利益率</th><th class="n">回転率</th><th class="n">レバレッジ</th><th class="n">ROE</th><th class="n">ROIC</th><th class="n">自己資本比率</th><th class="n">D/E</th><th class="n">売上CAGR</th></tr>` +
      CO.map((c) => { const m = M(c); return `<tr><td>${c.name}</td><td class="n">${pc(m.npm)}</td><td class="n">${fd(m.turn, 2)}</td><td class="n">${xx(m.lev, 2)}</td><td class="n"><b>${pc(m.roe)}</b></td><td class="n">${pc(m.roic)}</td><td class="n">${pc(m.eqr)}</td><td class="n">${xx(m.de, 2)}</td><td class="n">${pc(m.cagr)}</td></tr>`; }).join("");
  } };
}

function Valuation() {
  return { html: `${head("F 中級", "バリュエーション比較 ― EV/EBITDA・PEG・FCF利回り・理論PBR", "借入・成長・キャッシュまで考えた「値段の物さし」を使い分けます。")}
    ${goal("EV/EBITDA・PEG・FCF利回りで6社を比べ、理論PBR＝（ROE−g）÷（r−g）から「PBR1倍割れ」の理由を説明できる。")}
    <div class="card"><h2>前提（株主資本コスト r と永久成長率 g）</h2>${slider("vr", "日本株の r", 5, 12, 0.5, 8)}${slider("vu", "米国株の r", 5, 12, 0.5, 9)}${slider("vg", "永久成長率 g（日本1%・米国2%を基準に±）", -1, 1, 0.5, 0)}</div>
    <div class="card"><h2>6社のバリュエーション</h2><div class="tbl-wrap"><table class="fs" id="vtab"></table></div><p class="note">EV（企業価値）＝時価総額＋有利子負債−現金（会社を丸ごと買う値段）。EBITDA＝営業利益＋減価償却費。EV/EBITDA＝EV÷EBITDA。FCF利回り＝FCF÷時価総額（FCF＝営業CF−設備投資）。PEG＝PER÷EPS成長率（%）。1倍前後なら成長に比べて割高ではないとされます。ここでは直近の期の実績のEPS成長率で計算（本来は今後数年の予想成長率を使うことが多い）。減益の会社は計算しません（－）。Atlasのような景気敏感株は、景気の山での増益が長続きしないことが多いので注意。「実際÷理論」が1より大きいほど、市場が今以上の成長・改善を期待しています。</p></div>
    <div class="card"><h2>サクラ食品：PBR1倍にふさわしいROEは？</h2>${slider("vroe", "サクラ食品のROE（%）", 2, 16, 0.25, 6.25)}<div class="kpis" id="vk"></div></div>
    ${mq("EV（企業価値）の計算として正しいのは？", ["時価総額＋有利子負債−現金", "時価総額−有利子負債", "純資産＋負債", "売上高×PER"], 0, "会社を丸ごと買うときの値段。借入は引き継ぎ、現金はもらえるので差し引きます。")}
    ${mq("理論PBR＝（ROE−g）÷（r−g）。ROEが資本コストrと等しいとき、理論PBRは？", ["0倍", "1倍", "2倍", "rによる"], 1, "ROE＝rなら分子と分母が同じで1倍。ROEがrを下回るとPBR1倍割れが「理屈どおり」になります。")}
    ${pro("Northstarの「実際÷理論」は約5倍。今のROEではなく、将来の高い成長を前提にした値段です。期待が高い株ほど、少しの失望で大きく下がることを覚えておきましょう。")}`,
  mount(root) {
    const upd = () => {
      const rj = +$("#vr", root).value / 100, ru = +$("#vu", root).value / 100, dg = +$("#vg", root).value / 100;
      $("#vro", root).textContent = pc(rj); $("#vuo", root).textContent = pc(ru); $("#vgo", root).textContent = `日本${pc(0.01 + dg)}・米国${pc(0.02 + dg)}`;
      $("#vtab", root).innerHTML = `<tr><th>会社</th><th class="n">EV/EBITDA</th><th class="n">PER</th><th class="n">EPS成長率</th><th class="n">PEG</th><th class="n">FCF利回り</th><th class="n">実際のPBR</th><th class="n">ROE</th><th class="n">理論PBR</th><th class="n">実際÷理論</th></tr>` +
        CO.map((c) => {
          const m = M(c), r = isJP(c) ? rj : ru, g = (isJP(c) ? 0.01 : 0.02) + dg, th = (m.roe - g) / (r - g);
          return `<tr><td>${c.name}</td><td class="n">${xx(m.evebitda)}</td><td class="n">${xx(m.per)}</td><td class="n ${m.epsg < 0 ? "neg" : ""}">${spc(m.epsg)}</td><td class="n">${m.peg == null ? "－（減益）" : xx(m.peg, 2)}</td><td class="n">${pc(m.fcfy, 2)}</td><td class="n">${xx(m.pbr, 2)}</td><td class="n ${m.roe < r ? "neg" : ""}">${pc(m.roe)}</td><td class="n">${xx(th, 2)}</td><td class="n"><b>${xx(m.pbr / th, 2)}</b></td></tr>`;
        }).join("");
      const roe = +$("#vroe", root).value / 100, g = 0.01 + dg, th = (roe - g) / (rj - g), need = g + 1 * (rj - g), c = CO[1];
      $("#vroeo", root).textContent = pc(roe, 2);
      $("#vk", root).innerHTML = kpi("理論PBR", xx(th, 2), th < 1 ? "1倍割れが理屈どおり" : "1倍超えがふさわしい", th < 1 ? "neg" : "pos") + kpi("PBR1倍に必要なROE", pc(need), "＝g＋1×（r−g）＝r") +
        kpi("必要な純利益", money(c, need * c.equity), `今は${money(c, c.ni)}`) + kpi("実際のPBR", xx(M(c).pbr, 2), "株価1,400円÷BPS1,600円");
    };
    ["vr", "vu", "vg", "vroe"].forEach((id) => $("#" + id, root).addEventListener("input", upd)); upd();
  } };
}

function Earnings() {
  const e = D.earnJP, u = D.earnUS, cs = D.cons;
  const sgn = (x) => spc(x).replace("-", "−");
  const chk = [["通期予想に対する進捗率（例年と比べる）", "売上・EPSが予想を上回ったか（ビート／ミス）"], ["会社予想の修正（上方修正・下方修正）", "次の四半期・通期のガイダンス"],
    ["想定為替レートと実際のレートの差", "粗利率・営業利益率の変化"], ["配当予想・自社株買いの発表", "重要なKPI（顧客数・解約率・受注残など）"],

      <div class="tbl-wrap"><table class="fs" id="ecst"></table></div>

      ${[["実績PER（2026年3月期）", cs.eps_act, "直近の本決算の実績EPS。このアプリの「株価指標」などはこのPER"], ["予想PER（会社予想・2027年3月期）", cs.eps_guide, "会社予想の純利益185億円÷1億株"],

    <div class="card"><h2>米国：${u.name} ${u.period}</h2>
      ${slider("urev", "売上高の実績（百万ドル）", 2500, 2750, 5, u.rows[0][2])}${slider("ueps", "調整後EPSの実績（ドル）", 1.0, 1.5, 0.01, u.rows[1][2])}${slider("ugd", "次の四半期のガイダンス中央値（百万ドル）", 2600, 2900, 5, u.guide[2])}

    ${mq("米国企業がEPSで予想を上回ったのに株価が下がった。よくある理由は？", ["ガイダンスが予想を下回った", "配当がなかった", "株価が高すぎた", "決算書が英語だった"], 0, "米国では「次の見通し」が株価を大きく動かします。好決算でも見通しが弱いと売られます。")}

    ${mq("米国企業の役員が自社株を売ったことを、いちばん早く確認できる書類は？", ["10-K", "13F", "Form 4", "DEF 14A"], 2, "Form 4は取引から2営業日以内に出されます。13Fは機関投資家の四半期末の保有で、最大45日おくれて出ます。")}

    ${pro("決算で見るべきは数字そのものより「期待との差」。日本は会社予想に対する進捗とコンセンサスとの差、米国はアナリスト予想との差とガイダンス。発表前に「市場は何を期待しているか」をメモしておくと、反応の理由がよく分かります。決算短信や8-Kで数字をつかんだら、有価証券報告書や10-Kの「リスク」と「経営者の説明」で理由を確かめましょう。")}`,
  mount(root) {

function capDates(iso, t) { const [y, m, dd] = iso.split("-").map(Number), last = bdAdd(bdAdd(new Date(y, m - 1, dd + 1), -1), -t); return { rec: new Date(y, m - 1, dd), last, ex: bdAdd(last, 1) }; }
function jdate(d, yr) { return `${yr ? d.getFullYear() + "年" : ""}${d.getMonth() + 1}月${d.getDate()}日（${WDJ[d.getDay()]}）`; }

function Quality() {
  const E = D.capEv, sk = CO[1], skm = M(sk), jp = capDates(E.jp_rec, 2), us = capDates(E.us_rec, 1);

        <tr><td>権利落ち日（この日に買っても権利はない）</td><td>${jdate(jp.ex)}</td><td>${jdate(us.ex)}＝基準日と同じ日</td></tr></table></div>
      <p class="note">土日・祝日・年末年始は営業日に数えません（この例の日付の前後に祝日はありません）。権利付き最終日の取引の終わりに持っていれば、次の日に売っても権利はもらえます。</p></div>
    <div class="card"><h2>株主優待の利回り（${sk.name}・架空の設定：${f0(E.yutai_min)}株以上で、1年に${f0(E.yutai)}円相当の自社製品）</h2>

      <p class="note">自分が使わない品なら、優待の価値は低めに見ます。優待は配当とちがって廃止や内容の変更があるので、配当と同じ確かさでは見ません。</p></div>
    <div class="card"><h2>TOB・MBOの価格を評価する（${sk.name}・架空の設定：経営陣が1株${f0(E.tob)}円でMBOを発表）</h2>
      <div class="grid2"><div>${slider("tp", "TOB価格（円）", sk.price, 2400, 10, E.tob)}</div><div class="kpis" id="tk"></div></div>

    ${mq("営業CF÷純利益が1倍を大きく下回り続ける会社で、まず確認したいことは？", ["売掛金や在庫が増えて、利益が現金になっていない理由", "配当の回数", "株主優待の内容", "本社の場所"], 0, "利益が現金を伴わない状態が続くのは要注意のサインです。")}
    ${mq("NorthstarのSBCは売上の12%。FCF3,000百万ドルからSBCを引くと？", ["1,800百万ドル", "3,000百万ドル", "4,200百万ドル", "1,200百万ドル"], 0, "SBCは現金が出ませんが、株が増えて1株の価値が薄まる実質的な費用です。")}
    ${mq(`${E.jp_name}の期末配当の基準日は${jdate(jp.rec, 1)}。配当をもらうには、いつまでに買う必要がある？`, [jdate(bdAdd(jp.last, -1)), jdate(jp.last), jdate(jp.ex), jdate(jp.rec)], 1, `日本はT+2なので、基準日の2営業日前の${jdate(jp.last)}が権利付き最終日です。${jdate(bdAdd(jp.last, -1))}は、受け渡しが3営業日だった2019年7月より前のルールでの日付。${jdate(jp.ex)}（権利落ち日）に買っても、配当はもらえません。`)}
    ${mq("米国株（T+1）では、権利落ち日（Ex-date）と基準日（Record date）の関係は？", ["同じ日になる", "権利落ち日は基準日の2営業日前", "権利落ち日は基準日の次の営業日", "決まりはない"], 0, "2024年5月に米国の受け渡しがT+1になってから、権利落ち日は基準日と同じ日になりました。権利をもらうには、権利落ち日の前の営業日までに買います。")}
    ${mq(`${sk.name}（株価${f0(sk.price)}円）に、1株${f0(E.tob)}円のMBOが発表された。プレミアム（上乗せ率）は？`, ["約" + pc(vsR), "約" + pc(vsB), "約" + pc(wrong), "約" + pc(prem)], 3, `${f0(E.tob)}÷${f0(sk.price)}−1＝${pc(prem)}。${pc(wrong)}は上乗せ分をTOB価格で割ったまちがい、${pc(vsB)}はBPS（${f0(skm.bps)}円）に対する上乗せ、${pc(vsR)}は残余利益モデルの価値（約${f0(E.rim_ps)}円）に対する上乗せです。`)}
    ${mq(`${sk.name}の優待（${f0(E.yutai_min)}株以上で1年に${f0(E.yutai)}円相当）。${f0(big)}株持つときの優待利回りは？`, ["約" + pc(E.yutai / (sk.price * big), 2), "約" + pc(E.yutai / (sk.price * E.yutai_min), 2), "約" + pc(sk.dps / sk.price, 2), "約" + pc(E.yutai / (sk.price * E.yutai_min) + sk.dps / sk.price, 2)], 0, `${f0(E.yutai)}÷（${f0(sk.price)}円×${f0(big)}株）＝${pc(E.yutai / (sk.price * big), 2)}。株数を増やしても優待が同じなら、利回りは下がります。${pc(E.yutai / (sk.price * E.yutai_min), 2)}は${f0(E.yutai_min)}株のとき、${pc(sk.dps / sk.price, 2)}は配当利回り、${pc(E.yutai / (sk.price * E.yutai_min) + sk.dps / sk.price, 2)}は${f0(E.yutai_min)}株での合計です。`)}
    ${pro("自社株買いが大きくても、SBCで増えた株を買い戻しているだけのことがあります。「株式数が本当に減っているか」まで確かめるのが上級者です。TOBやMBOでは、プレミアムの大きさだけでなく、理論価値やPBRと比べて「安く買われていないか」も確かめます。")}`,
  mount(root) {
    let sb = "no";
    const draw = () => {
      $("#qtab", root).innerHTML = `<tr><th>会社</th><th class="n">営業CF÷純利益</th><th class="n">アクルーアル</th><th class="n">SBC÷売上</th><th class="n">${sb === "yes" ? "SBC調整後FCF" : "FCF"}</th><th class="n">FCFマージン</th><th class="n">Rule of 40</th></tr>` +
        CO.map((c) => { const m = M(c), f = sb === "yes" ? m.fcfSbc : m.fcf, fm = f / c.rev[2], r40 = m.g1 + fm; return `<tr><td>${c.name}</td><td class="n ${m.cfoNi < 1 ? "neg" : ""}">${xx(m.cfoNi, 2)}</td><td class="n">${spc(m.accr)}</td><td class="n">${pc(m.sbcr)}</td><td class="n">${money(c, f)}</td><td class="n">${pc(fm)}</td><td class="n ${r40 >= 0.4 ? "pos" : ""}"><b>${pc(r40)}</b></td></tr>`; }).join("");
    };
    bindSeg(root, "qsbc", (v) => { sb = v; draw(); }); draw();
    const mx = Math.max(...CO.map((c) => M(c).tsy));
    $("#qbars", root).innerHTML = CO.map((c) => { const m = M(c); return `<div class="row"><span>${c.name}</span><div class="track"><div class="fill c-link" style="left:0;width:${(m.dy / mx) * 100}%"></div><div class="fill c-acc" style="left:${(m.dy / mx) * 100}%;width:${(m.byy / mx) * 100}%"></div></div><span class="val">${pc(m.tsy, 2)}</span></div>`; }).join("");
    const yk = () => {
      const q = +$("#yq", root).value, v = +$("#yv", root).value / 100, inv = sk.price * q, yy = (q >= E.yutai_min ? E.yutai * v : 0) / inv, dy = sk.dps / sk.price;
      $("#yqo", root).textContent = f0(q) + "株"; $("#yvo", root).textContent = f0(v * 100) + "%";
      $("#yk", root).innerHTML = kpi("投資額", f0(inv) + "円", `株価${f0(sk.price)}円×${f0(q)}株`) + kpi("優待利回り", pc(yy, 2), "優待の価値÷投資額", "pos") +
        kpi("配当利回り（税引前）", pc(dy, 2), `1株配当（年${f0(sk.dps)}円）÷株価`) + kpi("合計（税引前）", pc(yy + dy, 2), q > E.yutai_min ? "株数を増やしても優待は同じなので、優待利回りは下がる" : "優待の分は、廃止や変更のリスクがある");

        kpi("残余利益モデルの価値との差", pfSpc(r), `理論価値 約${f0(E.rim_ps)}円。超上級「価値創造」のレッスンで計算する値で、ここでは結果だけ使います`, r < 0 ? "neg" : "") + kpi("買収にかかる金額", f0(t * sk.shares / 100) + "億円", "TOB価格×発行済株式数");
    };
    ["yq", "yv"].forEach((id) => $("#" + id, root).addEventListener("input", yk)); $("#tp", root).addEventListener("input", tk); yk(); tk();

/* ---------- T basic / intermediate ---------- */
function stockSeg(id, on) { return seg(id, [["0", "ミライ精機（日本）"], ["1", "Northstar（米国）"]], String(on)); }
function priceFmt(st) { return (v) => fd(v, st.us ? 2 : 0); }

function candleType(o, h, l, c) {
  const body = Math.abs(c - o), rng = h - l;
  if (body <= 0.1 * rng) return "十字線（迷い）";
  if (Math.min(o, c) - l >= 2 * body) return "下ヒゲが長い（下で買われた）";
  if (h - Math.max(o, c) >= 2 * body) return "上ヒゲが長い（上で売られた）";
  if (body >= 0.6 * rng) return c > o ? "大陽線" : "大陰線";
  return "コマ（小さな足）";
}
function miniCandle(o, h, l, c, style) {
  const lo = 930, hi = 1075, Y = (v) => 8 + (hi - v) / (hi - lo) * 104, cls = c >= o ? (style === "us" ? "cu-us" : "cu-jp") : (style === "us" ? "cd-us" : "cd-jp");
  return `<svg viewBox="0 0 60 120" width="60" height="120" aria-hidden="true"><line class="${cls}" x1="30" x2="30" y1="${Y(h)}" y2="${Y(l)}"/><rect class="${cls}" x="18" width="24" y="${Y(Math.max(o, c))}" height="${Math.max(Math.abs(Y(o) - Y(c)), 1.5)}"/></svg>`;
}

function Candles() {
  return { html: `${head("T 初級", "ローソク足 ― 1本の足から「買いと売りの力くらべ」を読む", "ローソク足は日本で生まれたといわれるチャート（江戸時代の米相場がルーツとされる）。今では世界中で使われています（Candlestick）。")}
    ${goal("始値・高値・安値・終値からローソク足を読み、代表的な形を見分けられる。日本と米国の色のちがいも知る。")}
    <div class="card"><h2>チャートラボ</h2><div class="btnrow">${stockSeg("cs", 0)}${seg("cc", [["jp", "日本式の色（陽線＝赤）"], ["us", "米国式の色（上昇＝緑）"]], "jp")}${seg("cn", [["60", "60日"], ["120", "120日"]], "60")}</div>
      <div id="cbox"></div><p class="small muted">チャートにマウスを乗せると、その日の4本値が見られます。</p></div>
    <div class="card"><h2>練習：8本のローソク足を分類しよう</h2><p class="small">それぞれの足に当てはまる形を選んでください（このアプリのルール：実体が値幅の10%以下→十字線、下ヒゲが実体の2倍以上→下ヒゲ、上ヒゲが実体の2倍以上→上ヒゲ、実体が値幅の60%以上→大陽線・大陰線、それ以外→コマ）。</p>
      <div class="grid4" id="cq"></div><div class="btnrow"><button class="btn" type="button" id="cqchk">答え合わせ</button><span id="cqres" class="small"></span></div></div>
    ${mq("終値が始値より高いローソク足は？", ["陰線", "陽線", "十字線", "ヒゲ"], 1, "陽線＝上昇、陰線＝下落。米国のチャートでは上昇が緑、下落が赤のことが多いので、赤の意味が日本と逆になることに注意。")}
    ${mq("安値圏で長い下ヒゲが出た。一般的な読み方は？", ["下値で買いが入った（反転のサインの候補）", "必ず暴落する", "取引が少ない", "配当の権利落ち"], 0, "いったん売られたが買い戻された形。出来高やトレンドと合わせて確認します。")}
    ${pro("ローソク足1本で決めつけないこと。どこで出たか（高値圏か安値圏か）、出来高、移動平均線との位置を合わせて見ると、サインの信頼度がぐっと上がります。")}`,
  mount(root) {
    let si = 0, style = "jp", nd = 60;
    const box = $("#cbox", root); box.className = "chartbox"; box.innerHTML = '<div class="tt"></div>'; box.id = "cbox";
    const draw = () => { const st = STK[si]; drawChart(box, { stock: st, a: st.n - nd, b: st.n, style, fmt: priceFmt(st), title: `${st.name}：直近${nd}日のローソク足`, panes: [{ h: 300, candles: true }, { h: 70, bars: { y: st.v, name: "出来高", cls: (i) => (st.c[i] >= st.o[i] ? "b-pos" : "b-neg") }, fmt: (v) => fd(v / 1e6, 1) + "M", label: "出来高" }] }); };
    bindSeg(root, "cs", (v) => { si = +v; style = si ? "us" : "jp"; $$("#cc button", root).forEach((b) => b.classList.toggle("on", b.dataset.v === style)); draw(); });
    bindSeg(root, "cc", (v) => { style = v; draw(); });
    bindSeg(root, "cn", (v) => { nd = +v; draw(); });
    draw();
    const opts = D.candleTypes;
    $("#cq", root).innerHTML = D.candles.map(([nm, o, h, l, c], k) => `<div class="tile" style="text-align:center"><div class="t">${nm}</div>${miniCandle(o, h, l, c, "jp")}<div class="small muted">始${o} 高${h}<br>安${l} 終${c}</div>
      <select class="search" data-k="${k}" aria-label="${nm}の形"><option value="">選んでください</option>${opts.map((x) => `<option>${x}</option>`).join("")}</select><div class="small" data-r="${k}"></div></div>`).join("");
    $("#cqchk", root).addEventListener("click", () => {
      let ok = 0;
      D.candles.forEach(([nm, o, h, l, c], k) => {
        const ans = candleType(o, h, l, c), sel = $(`select[data-k="${k}"]`, root).value, r = $(`[data-r="${k}"]`, root);
        if (sel === ans) { ok += 1; r.innerHTML = '<span class="check-ok">○ 正解</span>'; } else r.innerHTML = `<span class="check-ng">× 正解：${ans}</span>`;
      });
      $("#cqres", root).innerHTML = `<b>${ok} / ${D.candles.length} 問正解</b>${ok === D.candles.length ? "　すばらしい！" : ""}`;
    });
  } };
}

function MovingAvg() {
  return { html: `${head("T 初級", "移動平均線 ― トレンドの向きと強さをつかむ", "移動平均線は「直近N日の終値の平均」をつないだ線。日本と米国では、よく使われる日数がちがいます。")}
    ${goal("移動平均線でトレンドを判断し、ゴールデンクロス・デッドクロス・パーフェクトオーダー・乖離率を説明できる。")}
    <div class="card"><div class="btnrow">${stockSeg("ms", 0)}${seg("mset", [["jp", "日本式 5・25・75日"], ["us", "米国式 20・50・200日"]], "jp")}</div><div id="mbox"></div><div class="kpis" id="mk" style="margin-top:10px"></div></div>

      <tr><td><b>パーフェクトオーダー</b></td><td class="small">株価＞短期＞中期＞長期の順に並ぶ＝上昇トレンドが続いている形。いつまで続くかは分からない</td></tr><tr><td><b>乖離率</b></td><td class="small">株価÷移動平均線−1。離れすぎると線に戻ろうとしやすいとされる（強いトレンドでは離れたまま進むこともある）</td></tr>
      <tr><td><b>200日線（米国）</b></td><td class="small">米国では株価が200日線の上か下かが、強気・弱気の境目として特に注目される</td></tr></table></div>
    ${mq("短期線が長期線を下から上に抜けることを何という？", ["デッドクロス", "ゴールデンクロス", "ダイバージェンス", "ブレイクダウン"], 1, "上昇への転換の目安とされる形。ただし移動平均線は遅れて動くので、だましも多い。")}
    ${mq("5日間の終値が100・102・104・103・106のとき、5日移動平均は？", ["102", "103", "104", "105"], 1, "（100＋102＋104＋103＋106）÷5＝103。")}
    ${pro("移動平均線は「遅れて動く」のが弱点。GCが出たときには、すでにかなり上がっていることも多い。売買の合図そのものではなく「流れが変わったかの確認」に使いましょう。")}`,
  mount(root) {

    const box = $("#mbox", root); box.className = "chartbox"; box.innerHTML = '<div class="tt"></div>';
    const draw = () => {
      const st = STK[si], I = st.ind, ks = set === "jp" ? [5, 25, 75] : [20, 50, 200], n = st.n, a = n - 200;
      const cx = crosses(I.S[ks[0]], I.S[ks[1]]);

function xccc(c, t = 1) { const y = c.y[t], dso = y.ar / y.rev * 365, dio = y.inv / y.cogs * 365, dpo = y.ap / y.cogs * 365; return { dso, dio, dpo, ccc: dso + dio - dpo }; }
const BEN = [["dsri", "DSRI 売上債権の指数", 0.92, "売上に対する売上債権の割合が増えたか（1より大きいと要注意）"], ["gmi", "GMI 粗利率の指数", 0.528, "粗利率が下がると1より大きい"],

  niceTicks(0, ym, 5).forEach((t) => { s += `<line class="g-grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="g-ax" x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${f0(t)}</text>`; });

  s += `<polygon class="be-loss" points="${X(0)},${Y(0)} ${X(b.bep)},${Y(b.bep)} ${X(0)},${Y(cost(0))}"/>`;
  s += `<polygon class="be-profit" points="${X(b.bep)},${Y(b.bep)} ${X(xm)},${Y(xm)} ${X(xm)},${Y(cost(xm))}"/>`;
  s += `<line class="be-fixed" x1="${X(0)}" x2="${X(xm)}" y1="${Y(b.fixed)}" y2="${Y(b.fixed)}"/>`;
  s += `<line class="be-sales" x1="${X(0)}" y1="${Y(0)}" x2="${X(xm)}" y2="${Y(xm)}"/><line class="be-cost" x1="${X(0)}" y1="${Y(cost(0))}" x2="${X(xm)}" y2="${Y(cost(xm))}"/>`;
  s += `<line class="be-mark" x1="${X(b.bep)}" x2="${X(b.bep)}" y1="${Y(0)}" y2="${Y(b.bep)}"/><text class="be-t" x="${X(b.bep)}" y="${Y(b.bep) - 12}" text-anchor="end">損益分岐点 ${f0(b.bep)}</text>`;
  s += `<line class="be-op" x1="${X(b.rev2)}" x2="${X(b.rev2)}" y1="${Y(b.rev2)}" y2="${Y(cost(b.rev2))}"/>`;
  s += `<circle class="be-dot" cx="${X(b.rev)}" cy="${Y(b.rev)}" r="5"/><text class="be-t" x="${X(b.rev) - 8}" y="${Y(b.rev) - 10}" text-anchor="end">直近の期 ${f0(b.rev)}</text>`;

  s += `<text class="be-t" x="${X(xm) - 4}" y="${Y(b.fixed) + 18}" text-anchor="end">固定費 ${f0(b.fixed)}</text>`;
  return s + `<line class="g-axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/><line class="g-axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/></svg>`;

    };
    ["fs", "fr", "fn"].forEach((id) => $("#" + id, root).addEventListener("input", sv)); sv();

        kpi(sell >= 0 ? "目標に戻すために売る米国株" : "目標に戻すために売る日本株", fd(Math.abs(sell), 1) + "万円", sell >= 0 ? "売ったお金で日本株を買う" : "売ったお金で米国株を買う（日本株の税金はこの計算に入れていない）", "pos") +
        (gain < 0 ? kpi("売る米国株のうちの損失", fd(-gain, 2) + "万円", "値下がりした株を売るので利益は出ない") : kpi("売る米国株のうちの利益", fd(gain, 2) + "万円", sell > 0 ? "売る金額×（値上がり分÷今の金額）" : "米国株は売らない")) +

    };

function patSvg(name) {

function BbVol() {
  return { html: `${head("T 中級", "ボリンジャーバンド・出来高・チャートパターン", "値動きの「幅」と「本気度（出来高）」、そして形（パターン）から、次の大きな動きのヒントを探します。")}
    ${goal("ボリンジャーバンドの%b・スクイーズ・バンドウォーク、出来高の急増、代表的なチャートパターンを読み取れる。")}

    <div class="card"><h2>代表的なチャートパターン</h2><div class="grid3">${D.patterns.map(([n, k, how, mean]) => `<div class="tile"><div class="cc">${patSvg(n)}<div><div class="t">${n}</div><span class="pill ${k === "天井" ? "warn" : k === "底" ? "ok" : ""}">${k}</span></div></div><div class="s" style="margin-top:6px">${how}</div></div>`).join("")}</div></div>

    ${pro("「出来高は株価に先行する」と言われます。長いもみ合いのあと、出来高をともなって上に抜けたときは、新しいトレンドの始まりになることがあります（だましもあるので、損切りの位置を先に決めておく）。ミライ精機の出来高の山を探してみましょう。")}`,
  mount(root) {

    const draw = () => {

      const pb = I.pb[n - 1], bw = I.bw[n - 1], w = I.bw.slice(n - 120, n), mn = Math.min(...w), mx = Math.max(...w);

  ["FCF利回り", (m) => m.fcfy, 0.05, 0.03, true, pc], ["営業CF÷純利益", (m) => m.cfoNi, 1.2, 1.0, true, (v) => xx(v, 2)], ["株主還元利回り", (m) => m.tsy, 0.04, 0.02, true, pc]];
function scoreOf(co) {
  const m = M(co);
  const rows = SC_RULES.map(([n, f, g, o, hi, fmt]) => { const v = f(m); const s = v == null || !isFinite(v) ? 1 : hi ? (v >= g ? 3 : v >= o ? 2 : 1) : (v <= g ? 3 : v <= o ? 2 : 1); return { n, v, s, fmt, g, o, hi }; });
  return { rows, avg: rows.reduce((a, r) => a + r.s, 0) / rows.length };
}
function techStatus(si) {

  const s1 = I.S[ks[0]][n - 1], s2 = I.S[ks[1]][n - 1], s3 = I.S[ks[2]][n - 1];

  const r = I.rsi[n - 1];

    <button class="btn ghost" type="button" ${prev ? `data-go="${prev.id}"` : "disabled"}>◀ ${prev ? prev.title : "前へ"}</button>
    <button class="btn ghost" type="button" data-toggle-done="${L.id}">${done[L.id] ? "✓ 完了済み（取り消す）" : "このレッスンを完了にする"}</button>
    ${next ? `<button class="btn" type="button" data-go="${next.id}" data-complete="${L.id}">完了して次へ：${next.title} ▶</button>` : `<button class="btn" type="button" data-complete="${L.id}" data-go="welcome">完了してトップへ</button>`}</div>`;
  if (window.LearnShell && LearnShell.xlRef && XL_SHEETS[L.id]) LearnShell.xlRef(main, XL_SHEETS[L.id]);
  if (out.mount) out.mount(main);
  window.scrollTo(0, 0);
}
document.addEventListener("click", (e) => {
  const opt = e.target.closest(".quiz .opt");
  if (opt) {
    const box = opt.closest(".quiz"), ans = +box.dataset.ans, i = +opt.dataset.i;
    $$(".opt", box).forEach((b) => b.classList.remove("right", "wrong"));
    opt.classList.add(i === ans ? "right" : "wrong");
    if (i !== ans) $$(".opt", box)[ans].classList.add("right");
    $(".fb", box).classList.add("show");
    return;
  }
  const td = e.target.closest("[data-toggle-done]");
  if (td) { const id = td.dataset.toggleDone; done[id] = !done[id]; store.set("done", done); renderNav(); td.textContent = done[id] ? "✓ 完了済み（取り消す）" : "このレッスンを完了にする"; return; }
  const g = e.target.closest("[data-go]");
  if (g && g.dataset.go) { e.preventDefault(); if (g.dataset.complete) { done[g.dataset.complete] = true; store.set("done", done); } go(g.dataset.go); }
});
$("#themeBtn").addEventListener("click", () => {
  const el = document.documentElement;
  el.setAttribute("data-theme", el.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
go(window.LearnShell ? LearnShell.start(LESSONS, current) : current);

</script>
<script>window.__X_CFG = {"app": "st", "hl": "ファンダメンタル分析＆テクニカル分析"};</script>
<script id="design-x-js">
/* デザインレイヤーの補助（見た目と移動のしやすさだけ。学習の記録や計算には触れない） */
(() => {
  const root = document.documentElement;
  const main = document.getElementById("main");
  const cfg = window.__X_CFG || {};

  /* 1) 読み進めた割合 → ヘッダー下のオレンジの線 */
  let ticking = false;
  const readUpd = () => {
    ticking = false;
    const max = root.scrollHeight - root.clientHeight;
    const r = max > 0 ? Math.min(1, Math.max(0, (window.scrollY || root.scrollTop) / max)) : 0;
    root.style.setProperty("--x-read", r.toFixed(4));
  };
  const readReq = () => { if (!ticking) { ticking = true; requestAnimationFrame(readUpd); } };
  window.addEventListener("scroll", readReq, { passive: true });
  window.addEventListener("resize", readReq);

  /* 2) 次に進むレッスン（トップページの「続きから」ボタン用） */
  const progress = () => {
    try {
      if (typeof LESSONS === "undefined" || typeof done === "undefined" || !Array.isArray(LESSONS)) return null;
      const list = LESSONS.filter((l) => l.id !== "welcome");
      const n = LESSONS.filter((l) => done[l.id]).length;
      const nx = list.find((l) => !done[l.id]) || null;
      return { n, total: LESSONS.length, nx };
    } catch (e) { return null; }
  };

  const decorate = () => {
    if (!main) return;
    /* レッスンの中身が <div class="lroot"> に包まれているアプリもある */
    const root = main.querySelector(":scope > .lroot") || main;
    const k = root.querySelector(":scope > .kicker");
    const home = !!k && /^(WELCOME|START)$/i.test(k.textContent.trim());
    main.classList.toggle("x-home", home);

    if (home) {
      /* 見出しを黒ボックスに。キーワードだけオレンジ */
      const h1 = root.querySelector(":scope > h1");
      if (h1 && !h1.querySelector(".x-box")) {
        const box = document.createElement("span");
        box.className = "x-box";
        while (h1.firstChild) box.appendChild(h1.firstChild);
        h1.appendChild(box);
        if (cfg.hl) {
          const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
          for (let t = walker.nextNode(); t; t = walker.nextNode()) {
            const i = t.nodeValue.indexOf(cfg.hl);
            if (i < 0) continue;
            const rest = t.splitText(i);
            rest.splitText(cfg.hl.length);
            const em = document.createElement("em");
            em.className = "x-hl";
            rest.parentNode.replaceChild(em, rest);
            em.textContent = cfg.hl;
            break;
          }
        }
      }
      /* 「はじめる／続きから」ボタン */
      if (!main.querySelector(".x-cta-row")) {
        const p = progress();
        let target = p && p.nx;
        if (p && !target && typeof LESSONS !== "undefined") target = LESSONS.find((l) => l.id === "quiz") || null;
        if (p && target) {
          const row = document.createElement("div");
          row.className = "x-cta-row";
          const b = document.createElement("button");
          b.type = "button";
          b.className = "btn x-cta";
          b.dataset.go = target.id;
          const lab = document.createElement("span");
          lab.textContent = (p.n === 0 ? "最初のレッスンへ：" : p.nx ? "続きから：" : "おさらい：") + target.title;
          const arr = document.createElement("span");
          arr.className = "x-arrow";
          arr.setAttribute("aria-hidden", "true");
          b.append(lab, arr);
          const note = document.createElement("span");
          note.className = "x-cta-note";
          note.innerHTML = "完了 <b></b> / " + p.total;
          note.querySelector("b").textContent = String(p.n);
          row.append(b, note);
          const anchor = root.querySelector(":scope > .lead") || h1 || k;
          anchor.insertAdjacentElement("afterend", row);
        }
      }
    }

    /* 3) 「完了して次へ」ボタンに矢印の丸 */
    main.querySelectorAll(".next-row .btn[data-complete]").forEach((b) => {
      if (b.querySelector(".x-arrow")) return;
      const label = b.textContent.replace(/\s*▶\s*$/, "").trim();
      b.textContent = "";
      const s = document.createElement("span");
      s.textContent = label;
      const arr = document.createElement("span");
      arr.className = "x-arrow";
      arr.setAttribute("aria-hidden", "true");
      b.append(s, arr);
    });
    readReq();
  };

  if (main) {
    try { new MutationObserver(decorate).observe(main, { childList: true }); } catch (e) { /* MutationObserver unavailable */ }
    decorate();
  }
  readUpd();
})();

</script>
